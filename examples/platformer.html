<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>glemy — Platformer</title>
<style>
  body {
    background: #111;
    color: #ccc;
    font-family: system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    gap: 1rem;
  }
  canvas {
    width: 512px;
    height: 512px;
    background: #000;
    image-rendering: pixelated;
  }
  #glemy-canvas-wrap {
    position: relative;
    width: 512px;
    height: 512px;
  }
  #glemy-platforms {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .glemy-platform {
    position: absolute;
    background: #8a5;
    border: 1px solid #111;
    box-sizing: border-box;
  }
  #glemy-goal {
    position: absolute;
    background: #fd5;
    border: 1px solid #111;
    box-sizing: border-box;
    pointer-events: none;
  }
  #glemy-status {
    color: #8a5;
    font-size: 1.5rem;
    font-weight: bold;
  }
  #glemy-error {
    color: #fff;
    background: #a00;
    border-radius: 4px;
    padding: 0.5rem 0.75rem;
    max-width: 512px;
    font-size: 0.9rem;
  }
</style>
</head>
<body>
<div id="glemy-canvas-wrap">
  <canvas id="glemy-canvas"></canvas>
  <div id="glemy-platforms"></div>
  <div id="glemy-goal"></div>
</div>
<div id="glemy-status" hidden></div>
<div id="glemy-error" hidden></div>
<p>Arrow keys to move, space to jump. Reach the yellow goal.</p>
<script>
  window.addEventListener("error", (event) => {
    const el = document.getElementById("glemy-error");
    el.textContent =
      "Something went wrong before the game could start: " +
      (event.error?.message ?? event.message) +
      ". Try a hard refresh (Ctrl+Shift+R / Cmd+Shift+R).";
    el.hidden = false;
  });
</script>
<script type="module">
  import { main } from "./platformer.js";
  const texture_width = 64;
  const texture_height = 64;

  const canvas = document.getElementById("glemy-canvas");
  canvas.width = texture_width;
  canvas.height = texture_height;

  main();
</script>
</body>
</html>
