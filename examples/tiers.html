<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>glemy</title>
<style>
  body {
    background: #111;
    color: #ccc;
    font-family: system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    gap: 1rem;
  }
  canvas {
    width: 512px;
    height: 512px;
    background: #000;
    cursor: pointer;
    image-rendering: pixelated;
  }
  #glemy-canvas-wrap {
    position: relative;
    width: 512px;
    height: 512px;
  }
  #glemy-danger-line {
    position: absolute;
    left: 0;
    right: 0;
    border-top: 2px dashed #f55;
    pointer-events: none;
  }
  @keyframes glemy-merge-flash {
    0% {
      filter: brightness(1);
    }
    30% {
      filter: brightness(1.6);
    }
    100% {
      filter: brightness(1);
    }
  }
  #glemy-canvas-wrap.glemy-flash {
    animation: glemy-merge-flash 0.2s ease-out;
  }
  #glemy-score {
    font-size: 1.25rem;
  }
  #glemy-next {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  #glemy-next-tier {
    width: 1.5rem;
    height: 1.5rem;
    border-radius: 50%;
    border: 1px solid #666;
  }
  #glemy-game-over {
    color: #f55;
    font-size: 1.5rem;
    font-weight: bold;
  }
  #glemy-error {
    color: #fff;
    background: #a00;
    border-radius: 4px;
    padding: 0.5rem 0.75rem;
    max-width: 512px;
    font-size: 0.9rem;
  }
</style>
</head>
<body>
<div id="glemy-canvas-wrap">
  <canvas id="glemy-canvas"></canvas>
  <div id="glemy-danger-line"></div>
</div>
<div id="glemy-score">Score: 0</div>
<div id="glemy-next">
  Next: <div id="glemy-next-tier"></div>
</div>
<div id="glemy-game-over" hidden>Game Over!</div>
<div id="glemy-error" hidden></div>
<p>Click to drop.</p>
<script>
  window.addEventListener("error", (event) => {
    const el = document.getElementById("glemy-error");
    el.textContent =
      "Something went wrong before the game could start: " +
      (event.error?.message ?? event.message) +
      ". Try a hard refresh (Ctrl+Shift+R / Cmd+Shift+R).";
    el.hidden = false;
  });
</script>
<script type="module">
  import { main } from "./tiers.js";
  const texture_width = 64;
  const texture_height = 64;

  const canvas = document.getElementById("glemy-canvas");
  canvas.width = texture_width;
  canvas.height = texture_height;

  main();
</script>
</body>
</html>
